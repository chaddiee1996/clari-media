const hStr = m => String(Math.floor(m / 60)), mStr = m => String(m % 60).padStart(2, '0');

function casement(k, open, dawn) {

  k.fillStyle = mc('#B89AD8', '#EBD6F2', dawn); rr(k, 664, 330, 236, 190, 10); k.fill(); k.restore();

function bed(k, t, dawn, duvetX, lag, pil) {

}

  sh.addColorStop(0, `rgba(230,215,255,${0.10 + 0.08 * dawn})`); sh.addColorStop(1, 'rgba(230,215,255,0)');
  k.fillStyle = sh; k.beginPath(); k.moveTo(140, 744); k.lineTo(520, 744); k.lineTo(980, 1400); k.lineTo(430, 1400); k.closePath(); k.fill();
  if (dawn > 0) { const s2 = k.createLinearGradient(0, 740, 0, 1400); s2.addColorStop(0, `rgba(255,221,181,${0.16 * dawn})`); s2.addColorStop(1, 'rgba(255,221,181,0)'); k.fillStyle = s2; k.fill(); }
}
function rugAndSlippers(k, dawn) {
  k.save(); k.shadowColor = 'rgba(10,3,24,0.5)'; k.shadowBlur = 20; k.shadowOffsetY = 8;
  const g = k.createLinearGradient(0, 1470, 0, 1580); g.addColorStop(0, mc('#3E1C6C', '#6A4A98', dawn)); g.addColorStop(1, mc('#2A1350', '#4A3070', dawn));
  k.fillStyle = g; rr(k, 60, 1478, 900, 92, 46); k.fill(); k.restore();
  k.strokeStyle = rgba('#F7B6CD', 0.35); k.lineWidth = 6; rr(k, 84, 1494, 852, 60, 30); k.stroke();
  // slippers, side by side, toes to the left
  [[360, 1466], [500, 1472]].forEach(([x, y]) => {
    k.save(); k.shadowColor = 'rgba(10,3,24,0.45)'; k.shadowBlur = 14; k.shadowOffsetY = 6;
    const sg = k.createLinearGradient(0, y - 34, 0, y + 10); sg.addColorStop(0, '#F7B6CD'); sg.addColorStop(1, '#C77AA6');
    k.fillStyle = sg; k.beginPath(); k.moveTo(x - 70, y + 8); k.quadraticCurveTo(x - 78, y - 30, x - 30, y - 34); k.lineTo(x + 40, y - 20); k.quadraticCurveTo(x + 74, y - 14, x + 70, y + 8); k.closePath(); k.fill(); k.restore();
    k.fillStyle = 'rgba(255,248,236,0.55)'; k.beginPath(); k.ellipse(x - 34, y - 26, 30, 9, -0.15, 0, TAU); k.fill();
  });
}
function streaks(k, t) {
  k.save(); k.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const st = 7.55 + i * 0.13, p = (t - st) / 0.9; if (p < 0 || p > 1.2) continue;
    const y = 450 + i * 52;
    const path = new Path2D(`M${300} ${y} C ${520} ${y - 40}, ${700} ${y + 120 + i * 20}, ${1060} ${y + 160 + i * 40}`);
    k.setLineDash([200, 2400]); k.lineDashOffset = 200 - S.ease('power2.out')(clamp(p, 0, 1)) * 1100;
    k.strokeStyle = `rgba(241,234,247,${0.5 * (1 - clamp((p - 0.7) / 0.5, 0, 1))})`; k.lineWidth = 5 - i * 0.4; k.stroke(path);
  }
  k.restore();
}
function leaf(k, t) {
  const st = 7.6, p = clamp((t - st) / 1.25, 0, 1); if (t < st) return;
  const e = S.ease('power2.out')(p);
  const bz = (a, b, cc, d, u) => (1 - u) ** 3 * a + 3 * (1 - u) ** 2 * u * b + 3 * (1 - u) * u * u * cc + u ** 3 * d;
  const x = bz(330, 820, 700, 250, e), y = bz(520, 560, 980, 958, e) + Math.sin(e * 9) * 14 * (1 - e);
  const rot = mix(0.4, TAU * 2 + 0.12, e);
  k.save(); k.translate(x, y); k.rotate(rot); k.scale(1.25, (0.55 + 0.45 * Math.abs(Math.cos(e * 7))) * (1 - 0.4 * seg(p, 0.85, 0.15)));
  const g = k.createLinearGradient(-30, 0, 30, 0); g.addColorStop(0, '#FFE29A'); g.addColorStop(1, '#F5A97E');
  k.fillStyle = g; k.beginPath(); k.moveTo(-34, 0); k.quadraticCurveTo(0, -22, 34, 0); k.quadraticCurveTo(0, 22, -34, 0); k.fill();
  k.strokeStyle = '#C9744E'; k.lineWidth = 2.5; k.beginPath(); k.moveTo(-40, 0); k.lineTo(28, 0); k.stroke();
  k.restore();
}
function plant(k, cam, al) {
  if (al <= 0) return;
  const z = 1 + (cam.z - 1) * 1.4, ox = -(cam.fx - 540) * 0.5, oy = -(cam.fy - 960) * 0.5;
  k.save(); k.globalAlpha = al; k.translate(1000 + ox, 1860 + oy); k.scale(z, z); k.filter = 'blur(5px)';
  k.fillStyle = '#1E0C3A';
  [[-1.9, 300], [-1.55, 360], [-1.2, 330], [-0.85, 270], [-2.3, 240]].forEach(([a, l]) => {
    k.save(); k.rotate(a + Math.PI / 2); k.beginPath(); k.moveTo(0, 0); k.quadraticCurveTo(-70, -l * 0.5, 0, -l); k.quadraticCurveTo(70, -l * 0.5, 0, 0); k.fill(); k.restore();
  });
  k.fillStyle = '#1C0B38'; k.beginPath(); k.moveTo(-120, -40); k.lineTo(120, -40); k.lineTo(96, 200); k.lineTo(-96, 200); k.fill();
  k.filter = 'none'; k.restore();
}

// ---------- camera ----------
function camera(t) {
  const pb = seg(t, 1.38, 1.05, 'expo.inOut');
  const z0 = 2.42 + 0.12 * seg(t, 0, 1.5, 'sine.out');
  let z = mix(z0, 1.14, S.ease('power2.inOut')(pb)), fx = mix(790, 540, pb), fy = mix(795, 943, pb), px = mix(540, 540, pb), py = mix(690, 960, pb);
  z += 0.05 * seg(t, 2.3, 6.6, 'sine.inOut');
  fx += -28 * seg(t, 7.3, 1.3, 'power2.inOut') + 28 * seg(t, 9.0, 1.2, 'power2.inOut');
  fy += 175 * seg(t, 8.95, 1.1, 'expo.inOut');
  z += 0.07 * seg(t, 11.3, 3.4, 'sine.inOut');
  return { z, fx, fy, px, py, reveal: pb };
}

// ---------- text ----------
const txt = document.getElementById('txt'), TB = TYPE.block;
const b1 = TB(txt, '3:07am.', { left: 0, top: 1060, width: 1080, size: 210 });
const bD = TB(txt, 'Duvet <span class="slot"><span class="w0">off.</span><span class="w1">on.</span><span class="w2">off.</span></span>', { left: 110, top: 1300, width: 820, size: 170 });
const slotW = [...bD.el.querySelectorAll('.slot span')];
const b5 = TB(txt, 'Pillow flipped|to the <i>cold</i> side.', { left: 110, top: 1278, width: 820, size: 124 });
const b6 = TB(txt, 'Window open.|In November.', { left: 110, top: 1272, width: 820, size: 130 });
const b7 = TB(txt, 'By breakfast, you’ll|have <i>forgotten</i>|it happened.', { left: 100, top: 1150, width: 840, size: 112, lh: 1.07 });
const b8a = TB(txt, 'Night sweats', { left: 110, top: 1040, width: 820, size: 156 });
const b8b = TB(txt, 'are on the NHS list of|perimenopause symptoms.', { left: 110, top: 1238, width: 820, size: 66, lh: 1.22, cls: 'sans' });
const b8c = TB(txt, 'Source: NHS', { left: 110, top: 1430, width: 820, size: 46, cls: 'src' });
const b9 = TB(txt, 'Log it <i>before</i>|you forget.', { left: 110, top: 1262, width: 820, size: 124 });

function slotSwap(t) {
  // word 0 'off.' in at b2, swaps to 'on.' at b3, back to 'off.' at b4
  const sw = [[T.b2, T.b3], [T.b3, T.b4], [T.b4, T.b5]];
  slotW.forEach((el, i) => {
    const [a, b] = sw[i];
    const pin = i === 0 ? 1 : seg(t, a, 0.5, 'expo.out'), pout = seg(t, b, 0.34, 'power3.in');
    const y = i === 0 ? -pout * 105 : (1 - pin) * 105 - pout * 105;
    el.style.transform = `translateY(${y}%)`;
    el.style.opacity = (t >= a - 0.01 || i === 0) && t < b + 0.36 ? 1 : 0;
  });
}

// ---------- petals for the close ----------
const pr = S.rng(77);
const PET = Array.from({ length: 14 }, (_, i) => ({ x: pr() * 1100 - 10, d: pr() * 2.2, sp: 150 + pr() * 120, s: 0.55 + pr() * 0.7, r: pr() * TAU, vr: (pr() - 0.5) * 2.2, ph: pr() * TAU, front: i % 3 === 0 }));
function petals(k, t, front) {
  const t0 = T.b9 + 0.3; if (t < t0) return;
  PET.forEach(p => {
    if (p.front !== front) return;
    const u = t - t0 - p.d; if (u < 0) return;
    const y = -80 + u * p.sp, x = p.x + Math.sin(u * 1.3 + p.ph) * 50 - u * 30;
    A.petal(k, x, y, p.s * (front ? 1.5 : 1), p.r + u * p.vr, front ? 0.95 : 0.8);
  });
}

// ---------- render ----------
window.__timelines["main"] = S.play(function render(t) {
  const cam = camera(t);
  const dawn = seg(t, 9.05, 1.7, 'power2.inOut');
  // duvet: kick off (anticipation, fling), pull back on, kick off faster
  const dx = d => 18 * seg(d, 0, 0.12, 'power2.out');
  const duvetAt = u => {
    let x = 0;
    x += 18 * seg(u, T.b2 + 0.12, 0.12, 'power2.out') - 18 * seg(u, T.b2 + 0.24, 0.1) - 800 * seg(u, T.b2 + 0.24, 0.62, 'expo.out');
    x += 800 * seg(u, T.b3 + 0.06, 0.7, 'back.out(1.15)');
    x += -800 * seg(u, T.b4 + 0.08, 0.42, 'expo.out');
    return x;
  };
  const dX = duvetAt(t), vel = (dX - duvetAt(t - 1 / 30)) * 30;
  const lag = clamp(-vel * 0.05, -70, 70);
  const pf = seg(t, T.b5 + 0.12, 0.62, 'power3.inOut');
  const pil = { a: pf * Math.PI, hop: 80 * Math.sin(pf * Math.PI), tilt: 0.12 * Math.sin(pf * Math.PI), spark: clamp((t - T.b5 - 0.6) / 0.6, 0, 2.2) };
  const open = seg(t, T.b6 + 0.08, 0.75, 'back.out(1.4)') + 0.04 * Math.sin((t - T.b6 - 0.8) * 7) * Math.exp(-(t - T.b6 - 0.8) * 2.2) * (t > T.b6 + 0.8 ? 1 : 0);
  const wind = seg(t, T.b6 + 0.15, 0.35, 'power2.out') * (1 - seg(t, T.b6 + 1.2, 1.4, 'sine.inOut') * 0.75);

  // ---- room into the offscreen canvas ----
  rc.setTransform(1, 0, 0, 1, 0, 0); rc.clearRect(0, 0, W, H);
  rc.setTransform(cam.z, 0, 0, cam.z, cam.px - cam.fx * cam.z, cam.py - cam.fy * cam.z);
  const ox = (cam.fx - 540) * 0.25;
  wallAndFloor(rc, dawn, t);
  windowArt(rc, t, dawn, open, ox);
  curtain(rc, 50, 175, -1, wind * 0.5, t, dawn);
  curtain(rc, 470, 598, 1, wind, t, dawn);
  rc.fillStyle = mc('#B89AD8', '#EBD6F2', dawn); rc.fillRect(30, 166, 590, 10);
  rc.beginPath(); rc.arc(30, 171, 13, 0, TAU); rc.arc(620, 171, 13, 0, TAU); rc.fill();
  casement(rc, open, dawn);
  picture(rc, t, dawn);
  nightstand(rc, dawn);
  rugAndSlippers(rc, dawn);
  bed(rc, t, dawn, dX, lag, pil);
  streaks(rc, t);
  leaf(rc, t);
  // darkness of 3am, before the eyes adjust
  rc.setTransform(1, 0, 0, 1, 0, 0);
  const dark = 0.94 * (1 - seg(t, 1.3, 1.1, 'power2.inOut'));
  if (dark > 0) { rc.fillStyle = `rgba(10,3,24,${dark})`; rc.fillRect(0, 0, W, H); }
  rc.setTransform(cam.z, 0, 0, cam.z, cam.px - cam.fx * cam.z, cam.py - cam.fy * cam.z);
  clock(rc, t);
  rc.setTransform(1, 0, 0, 1, 0, 0);
  plant(rc, cam, cam.reveal);

  // ---- composite ----
  const blur = 12 * seg(t, T.b9, 0.8, 'power2.out');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#12062A'; c.fillRect(0, 0, W, H);
  if (blur > 0.3) { c.filter = `blur(${blur}px)`; c.drawImage(room, -20, -20, W + 40, H + 40); c.filter = 'none'; }
  else c.drawImage(room, 0, 0);
  // vignette
  const vg = c.createRadialGradient(540, 860, 300, 540, 960, 1250); vg.addColorStop(0, 'rgba(10,3,24,0)'); vg.addColorStop(1, 'rgba(10,3,24,0.55)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
  // scrim for the dawn lines and the fact
  const scr = Math.max(seg(t, T.b7, 0.6, 'power2.out') * 0.55, seg(t, T.b8 - 0.1, 0.6, 'power2.out') * 0.85);
  if (scr > 0) {
    const sg = c.createLinearGradient(0, 820, 0, 1700); sg.addColorStop(0, 'rgba(18,6,40,0)'); sg.addColorStop(0.45, `rgba(18,6,40,${scr})`); sg.addColorStop(1, `rgba(18,6,40,${scr})`);
    c.fillStyle = sg; c.fillRect(0, 0, W, H);
  }
  // the close: dim, phone rises
  const ph = seg(t, T.b9, 0.95, 'expo.out');
  if (t >= T.b9) {
    c.fillStyle = `rgba(18,6,40,${0.6 * seg(t, T.b9, 0.8)})`; c.fillRect(0, 0, W, H);
    petals(c, t, false);
    const fl = Math.sin((t - T.b9) * 1.6) * 8 * seg(t, T.b9 + 0.8, 1.0);
    const py = mix(2700, 716, ph) + fl, rot = mix(-0.16, -0.035, ph) + 0.006 * Math.sin((t - T.b9) * 1.1);
    const pz = 1 + 0.04 * seg(t, T.b9 + 1, 4.5, 'sine.inOut');
    c.save(); c.translate(540, py); c.scale(pz, pz); c.translate(-540, -py);
    A.phone(c, logImg, 540, py, 490, { rot });
    // tap on Night Sweats
    const tp = (t - (T.b9 + 1.95)) / 0.9;
    if (tp > 0 && tp < 1) {
      c.save(); c.translate(540, py); c.rotate(rot);
      const tx = (0.74 - 0.5) * 490, ty = (0.79 - 0.5) * 1062;
      c.strokeStyle = `rgba(255,248,236,${0.85 * (1 - tp)})`; c.lineWidth = 6; c.beginPath(); c.arc(tx, ty, 16 + 70 * S.ease('expo.out')(tp), 0, TAU); c.stroke();
      c.fillStyle = `rgba(255,248,236,${0.5 * (1 - tp)})`; c.beginPath(); c.arc(tx, ty, 22, 0, TAU); c.fill();
      c.restore();
    }
    c.restore();
    petals(c, t, true);
  }

  // ---- type ----
  TYPE.show(b1, t, 0.5, 1.5, { dur: 0.8 });
  TYPE.show(bD, t, T.b2, T.b5 - 0.05);
  slotSwap(t);
  TYPE.show(b5, t, T.b5 + 0.05, T.b6 - 0.05);
  TYPE.show(b6, t, T.b6 + 0.05, T.b7 - 0.05);
  TYPE.show(b7, t, T.b7 + 0.1, T.b8 - 0.08, { stag: 0.12 });
  TYPE.show(b8a, t, T.b8 + 0.05, T.b9 - 0.05);
  TYPE.show(b8b, t, T.b8 + 0.25, T.b9 - 0.05, { stag: 0.08 });
  TYPE.show(b8c, t, T.b8 + 0.55, T.b9 - 0.05);
  TYPE.show(b9, t, T.b9 + 0.45, null, { stag: 0.1 });
}, { loop: false });
</script>
