<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,600;1,9..144,700&family=Figtree:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="studio.js"></script>
<script src="clari-art.js"></script>
<script src="type.js"></script>
<style>
  :root { --ink: #22103F; --ink2: #5F556B; --rose: #B83A68; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #EFE4F7; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #EFE4F7; }
  .abs { position: absolute; left: 0; top: 0; }
  #c { width: 1080px; height: 1920px; }
  #wt { width: 10px; height: 10px; transform-origin: 0 0; }
  .tblock { position: absolute; color: var(--ink); }
  .serif { font-family: 'Fraunces', serif; font-weight: 700; letter-spacing: -0.02em; font-variation-settings: "opsz" 144; }
  .serif i { font-style: italic; font-weight: 600; color: var(--rose); }
  .sans { font-family: 'Figtree', sans-serif; font-weight: 800; }
  .src { font-family: 'Figtree', sans-serif; font-weight: 700; color: var(--ink2); }
  .ln { overflow: hidden; padding: 0.02em 0.14em 0.2em; margin: -0.02em -0.14em -0.2em; white-space: nowrap; }
  .in { display: inline-block; will-change: transform; }
  .step .ln:nth-child(1) { padding-left: calc(0.14em + var(--s1, 0px)); }
  .step .ln:nth-child(2) { padding-left: calc(0.14em + var(--s2, 0px)); }
  .step .ln:nth-child(3) { padding-left: calc(0.14em + var(--s3, 0px)); }
  .step .ln:nth-child(4) { padding-left: calc(0.14em + var(--s4, 0px)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="21.6" data-width="1080" data-height="1920">
  <canvas id="c" class="abs" width="1080" height="1920"></canvas>
  <div id="wt" class="abs"></div>
  <div id="st" class="abs" style="width:1080px;height:1920px"></div>
</div>
<script>
const S = STUDIO, A = CLARI, P = A.P, W = 1080, H = 1920, TAU = Math.PI * 2;
const seg = S.seg, mix = S.mix, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cv = document.getElementById('c'), c = cv.getContext('2d');
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mc = (a, b, p) => { const A1 = hx(a), B1 = hx(b); return `rgb(${A1.map((v, i) => Math.round(v + (B1[i] - v) * p)).join(',')})`; };
const rr = A.rr;

// ---- staircase geometry (world px) ----
const G = 740, R = 330, Y0 = 1400;
const tx = i => G * i, ty = i => Y0 - R * i;          // left edge / top of tread i (0..4), 5 = landing
const STEP = [3.0, 5.3, 7.6, 10.2, 12.6], TURN = 14.6, FACT2 = 17.35, CLOSE = 19.0, D = 21.6;
const Fstep = i => [tx(i) + 440, ty(i) - 390];

function camera(t) {
  // hold position on stair k creeps up the slope, so the frame never sits still
  const Hk = k => { const f = Fstep(k), d = Math.max(0, t - (k === 5 ? 0 : STEP[k])); return [f[0] + 24 * d - 20, f[1] - 11 * d]; };
  let F = Hk(5), z = 1.0 + 0.03 * seg(t, 0, 2.4, 'sine.out'), Px = 540, Py = 960, bob = 0;
  const w = seg(t, 2.3, 0.8, 'expo.inOut');
  const h0 = Hk(0); F = [mix(F[0], h0[0], w), mix(F[1], h0[1], w)]; z = mix(z, 1, w) - 0.32 * Math.sin(w * Math.PI);
  for (let k = 1; k <= 4; k++) {
    const u = seg(t, STEP[k] - 0.08, 0.62, 'power3.inOut');
    if (u > 0) { const b = Hk(k); F = [mix(F[0], b[0], u), mix(F[1], b[1], u)]; bob += 22 * Math.sin(u * Math.PI); }
  }
  const pw = seg(t, TURN, 1.35, 'expo.inOut');
  const dw = Math.max(0, t - TURN - 1.35);
  F = [mix(F[0], 2150 + 60 * dw, pw), mix(F[1], 560 - 26 * dw, pw)]; z = mix(z, 0.315, S.ease('power2.inOut')(pw)); Px = mix(Px, 540, pw); Py = mix(Py, 1290, pw);
  z *= 1 + 0.09 * seg(t, TURN + 1.3, D - TURN - 1.3, 'sine.inOut');
  return { F, z, P: [Px, Py + bob * (1 - pw)], wide: pw };
}

// ---- room art ----
function wall(k, pink) {
  const g = k.createLinearGradient(0, -2600, 0, 2200); g.addColorStop(0, mc('#E3D3F3', '#F6D3E2', pink)); g.addColorStop(1, mc('#F8EEF2', '#FFE6EC', pink));
  k.fillStyle = g; k.fillRect(-3000, -3000, 10000, 6000);
  // panelling dado following the stairs (a soft band)
  k.fillStyle = mc('#E6D6F2', '#F5D5E2', pink);
  k.beginPath(); k.moveTo(-3000, Y0 + R - 420); for (let i = 0; i <= 5; i++) { k.lineTo(tx(i), ty(i) - 420 + R); k.lineTo(tx(i), ty(i) - 420); } k.lineTo(7000, ty(5) - 420); k.lineTo(7000, 3000); k.lineTo(-3000, 3000); k.fill();
}
function windowArt(k, t, pink) {
  const x0 = 3000, y0 = -1700, w = 620, h = 1000;
  k.save(); k.shadowColor = 'rgba(74,32,112,0.25)'; k.shadowBlur = 30; k.shadowOffsetY = 14;
  k.fillStyle = '#FFF8EC'; rr(k, x0 - 34, y0 - 34, w + 68, h + 68, 330); k.fill(); k.restore();
  k.save(); rr(k, x0, y0, w, h, 300); k.clip();
  const g = k.createLinearGradient(0, y0, 0, y0 + h);
  const day = ['#6B7BD8', '#9A90E2', '#C6A9EA', '#EBC6EA', '#FBE0EC'], pk = ['#E98BB6', '#F3A7C6', '#F7B6CD', '#FBCFDB', '#FFE3E8'];
  [0, 0.36, 0.66, 0.86, 1].forEach((p, i) => g.addColorStop(p, mc(day[i], pk[i], pink)));
  k.fillStyle = g; k.fillRect(x0, y0, w, h);
  // sun, then soft pink light
  const sx = x0 + 420, sy = y0 + 300 + 120 * pink;
  const sg = k.createRadialGradient(sx, sy, 10, sx, sy, 260); sg.addColorStop(0, 'rgba(255,248,236,0.9)'); sg.addColorStop(0.3, 'rgba(255,248,236,0.35)'); sg.addColorStop(1, 'rgba(255,248,236,0)');
  k.fillStyle = sg; k.fillRect(x0, y0, w, h);
  k.fillStyle = '#FFFCF2'; k.beginPath(); k.arc(sx, sy, 70, 0, TAU); k.fill();
  // clouds
  k.fillStyle = 'rgba(255,255,255,0.75)';
  [[x0 + 120 + 30 * Math.sin(t * 0.3), y0 + 520, 1], [x0 + 420 - 20 * Math.sin(t * 0.25), y0 + 700, 0.8]].forEach(([x, y, s]) => {
    k.beginPath(); k.ellipse(x, y, 120 * s, 40 * s, 0, 0, TAU); k.ellipse(x + 60 * s, y - 30 * s, 70 * s, 50 * s, 0, 0, TAU); k.ellipse(x - 50 * s, y - 20 * s, 60 * s, 40 * s, 0, 0, TAU); k.fill();
  });
  // a blossom tree outside
  k.save(); k.translate(x0 - 30, y0 + 760); A.branch(k, 0, 0, 3.0, false, t, { blossoms: 7 }); k.restore();
  k.restore();
  k.fillStyle = '#FFF8EC'; k.fillRect(x0 + w / 2 - 9, y0, 18, h); k.fillRect(x0, y0 + 560, w, 16);
  // sill
  k.fillStyle = '#FFF8EC'; rr(k, x0 - 60, y0 + h + 20, w + 120, 40, 12); k.fill();
}
function door(k, t) {
  const x = 4560, y = ty(5), w = 320, h = 820;
  k.fillStyle = '#FFF8EC'; rr(k, x - 26, y - h - 26, w + 52, h + 26, 18); k.fill();
  const g = k.createLinearGradient(0, y - h, 0, y); g.addColorStop(0, '#FFE9C9'); g.addColorStop(1, '#F8C9D8');
  k.fillStyle = g; k.fillRect(x, y - h, w, h);
  k.fillStyle = '#7A45B5'; k.beginPath(); k.moveTo(x, y - h); k.lineTo(x + 120, y - h + 40); k.lineTo(x + 120, y - 30); k.lineTo(x, y); k.closePath(); k.fill();
  k.fillStyle = P.gold; k.beginPath(); k.arc(x + 100, y - h / 2, 10, 0, TAU); k.fill();
  // a little table with a vase of blossom
  k.fillStyle = '#4A2070'; rr(k, 4230, y - 300, 300, 26, 10); k.fill(); k.fillRect(4260, y - 280, 18, 280); k.fillRect(4482, y - 280, 18, 280);
  k.fillStyle = '#F7B6CD'; rr(k, 4340, y - 420, 80, 120, 30); k.fill();
  k.save(); k.translate(4380, y - 420); k.rotate(-1.9); A.branch(k, 0, 0, 1.1, false, t, { blossoms: 5 }); k.restore();
}
function sunbeam(k, pink) {
  const g = k.createLinearGradient(3400, -700, 1200, 1400);
  g.addColorStop(0, `rgba(255,248,236,${0.55})`); g.addColorStop(1, 'rgba(255,248,236,0)');
  k.fillStyle = g; k.beginPath(); k.moveTo(3200, -1000); k.lineTo(3820, -1000); k.lineTo(2300, 1600); k.lineTo(800, 1600); k.closePath(); k.fill();
  if (pink > 0) { k.fillStyle = `rgba(247,182,205,${0.18 * pink})`; k.fill(); }
}
function frames(k, t, pink) {
  // three pictures climbing with the stairs
  const pics = [[150, 300, 240, 250, 'moon'], [1630, -370, 300, 230, 'branch'], [2380, -700, 220, 250, 'petals']];
  pics.forEach(([x, y, w, h, kind], i) => {
    k.save(); k.shadowColor = 'rgba(74,32,112,0.28)'; k.shadowBlur = 24; k.shadowOffsetY = 12;
    k.fillStyle = ['#C3A8EA', '#F7B6CD', '#FFF8EC'][i]; rr(k, x, y, w, h, 14); k.fill(); k.restore();
    const g = k.createLinearGradient(0, y + 18, 0, y + h - 18); g.addColorStop(0, '#4A2180'); g.addColorStop(1, '#8E57BE');
    k.fillStyle = g; k.fillRect(x + 18, y + 18, w - 36, h - 36);
    k.save(); k.beginPath(); k.rect(x + 18, y + 18, w - 36, h - 36); k.clip();
    if (kind === 'moon') { A.moon(k, x + w / 2 + 10, y + h / 2 - 10, 62, { glow: 0.8 }); A.sparkle(k, x + 70, y + 80, 0.8, 0.9); }
    if (kind === 'branch') A.branch(k, x + 4, y + 50, 1.3, false, t, { blossoms: 7 });
    if (kind === 'petals') { A.blossom(k, x + w / 2, y + h / 2, 1.1, 0.3, {}); }
    k.restore();
  });
}
function handrail(k) {
  k.save(); k.lineCap = 'round';
  const y0 = ty(0) + R - 660 - R, x0 = -800, x1 = tx(5) + 100;
  const yAt = x => y0 - (x - 0) * R / G;
  k.strokeStyle = 'rgba(74,32,112,0.18)'; k.lineWidth = 34; k.beginPath(); k.moveTo(x0, yAt(x0) + 14); k.lineTo(x1, yAt(x1) + 14); k.stroke();
  const gr = k.createLinearGradient(0, -40, 0, 40); k.strokeStyle = '#9A6AC8'; k.lineWidth = 28; k.beginPath(); k.moveTo(x0, yAt(x0)); k.lineTo(x1, yAt(x1)); k.stroke();
  k.strokeStyle = 'rgba(255,255,255,0.35)'; k.lineWidth = 6; k.beginPath(); k.moveTo(x0, yAt(x0) - 7); k.lineTo(x1, yAt(x1) - 7); k.stroke();
  k.fillStyle = '#7A45B5'; for (let x = 100; x < x1; x += 900) { k.fillRect(x - 8, yAt(x) + 10, 16, 40); k.beginPath(); k.arc(x, yAt(x) + 56, 14, 0, TAU); k.fill(); }
  k.restore();
}
function stairs(k, pink) {
  // stringer (the side of the staircase)
  const g = k.createLinearGradient(0, -400, 0, 2200); g.addColorStop(0, '#8E57BE'); g.addColorStop(1, '#4A2070');
  k.fillStyle = g; k.beginPath(); k.moveTo(-3000, Y0 + R); k.lineTo(0, Y0 + R);
  for (let i = 0; i <= 5; i++) { k.lineTo(tx(i), ty(i)); k.lineTo(tx(i) + (i === 5 ? 3000 : G), ty(i)); }
  k.lineTo(tx(5) + 3000, 3200); k.lineTo(-3000, 3200); k.closePath(); k.fill();
  // ground floor in front of the first step
  k.fillStyle = '#5A2C8C'; k.fillRect(-3000, Y0 + R, 3000, 2000);
  // the runner: a rose band over each tread and riser
  k.save(); k.lineJoin = 'round';
  k.beginPath(); k.moveTo(-3000, Y0 + R); k.lineTo(0, Y0 + R);
  for (let i = 0; i <= 5; i++) { k.lineTo(tx(i), ty(i)); k.lineTo(tx(i) + (i === 5 ? 3000 : G), ty(i)); }
  k.strokeStyle = '#E8628F'; k.lineWidth = 46; k.stroke();
  k.strokeStyle = 'rgba(255,248,236,0.55)'; k.lineWidth = 6; k.setLineDash([2, 22]); k.stroke(); k.setLineDash([]);
  k.restore();
  // nosings
  for (let i = 0; i < 5; i++) { k.fillStyle = '#FFF8EC'; rr(k, tx(i) - 18, ty(i) - 30, G + 4, 16, 8); k.fill(); }
  // stair rods (gold) at each riser
  for (let i = 0; i <= 5; i++) { k.fillStyle = P.gold; rr(k, tx(i) - 30, ty(i) + 10, 20, 70, 8); k.fill(); }
  // side panel mouldings
  k.strokeStyle = 'rgba(255,255,255,0.10)'; k.lineWidth = 8;
  for (let i = 0; i < 5; i++) { rr(k, tx(i) + 60, ty(i) + 90, G - 120, 190, 24); k.stroke(); }
}

// ---- lost things ----
const OBJ = STEP.map((s, i) => ({ x: tx(i) + (i === 3 ? 660 : 560), y: ty(i) - 28, t: s + 0.25 }));
function dropAt(t, o) {
  const f = seg(t, o.t, 0.34, 'power2.in');
  const land = t - (o.t + 0.34);
  const sq = land > 0 ? 0.22 * Math.exp(-land * 9) * Math.cos(land * 26) : 0;
  return { dy: -900 * (1 - f), sx: 1 + sq, sy: 1 - sq, show: t > o.t - 0.01, rot: (1 - f) * 0.4 };
}
function shadow(k, x, y, w, a) { k.fillStyle = `rgba(42,18,69,${0.28 * a})`; k.beginPath(); k.ellipse(x, y + 4, w, 14, 0, 0, TAU); k.fill(); }
function colander(k) {
  const g = k.createLinearGradient(-140, -150, 140, 0); g.addColorStop(0, '#E9E0F6'); g.addColorStop(1, '#A792C9');
  k.fillStyle = '#8E7BB4'; rr(k, -70, -24, 140, 24, 8); k.fill();
  k.fillStyle = g; k.beginPath(); k.moveTo(-150, -150); k.lineTo(150, -150); k.quadraticCurveTo(140, -10, 0, -16); k.quadraticCurveTo(-140, -10, -150, -150); k.fill();
  k.fillStyle = '#F4EEFA'; rr(k, -164, -166, 328, 26, 13); k.fill();
  k.fillStyle = 'rgba(74,32,112,0.55)';
  for (let r = 0; r < 3; r++) for (let j = -4 + r; j <= 4 - r; j++) { k.beginPath(); k.arc(j * 30, -112 + r * 34, 6, 0, TAU); k.fill(); }
  k.strokeStyle = '#B9A6DA'; k.lineWidth = 12; k.beginPath(); k.arc(-176, -140, 22, Math.PI * 0.5, Math.PI * 1.5); k.stroke(); k.beginPath(); k.arc(176, -140, 22, -Math.PI * 0.5, Math.PI * 0.5); k.stroke();
}
function glasses(k) {
  k.save(); k.translate(0, -50);
  k.strokeStyle = '#7A45B5'; k.lineWidth = 14;
  k.fillStyle = 'rgba(195,220,255,0.35)';
  [-80, 80].forEach(x => { k.beginPath(); k.ellipse(x, 0, 62, 52, 0, 0, TAU); k.fill(); k.stroke(); });
  k.beginPath(); k.moveTo(-22, -8); k.quadraticCurveTo(0, -28, 22, -8); k.stroke();
  k.lineWidth = 10; k.beginPath(); k.moveTo(-142, -6); k.lineTo(-180, 40); k.stroke(); k.beginPath(); k.moveTo(142, -6); k.lineTo(176, 40); k.stroke();
  k.fillStyle = 'rgba(255,255,255,0.7)'; [-96, 64].forEach(x => { k.beginPath(); k.ellipse(x, -16, 14, 8, -0.5, 0, TAU); k.fill(); });
  k.restore();
}
function mug(k, x, col, col2, t, ph) {
  k.save(); k.translate(x, 0);
  const g = k.createLinearGradient(-60, 0, 60, 0); g.addColorStop(0, col); g.addColorStop(1, col2);
  k.strokeStyle = col2; k.lineWidth = 16; k.beginPath(); k.arc(64, -80, 34, -1.2, 1.2); k.stroke();
  k.fillStyle = g; rr(k, -64, -160, 128, 160, 22); k.fill();
  k.fillStyle = 'rgba(255,255,255,0.22)'; rr(k, -50, -150, 18, 120, 9); k.fill();
  // steam
  k.strokeStyle = 'rgba(122,69,181,0.35)'; k.lineWidth = 7; k.lineCap = 'round';
  for (let j = 0; j < 2; j++) { k.beginPath(); const sx = -18 + j * 34; k.moveTo(sx, -180); k.bezierCurveTo(sx + 16 * Math.sin(t * 2 + ph + j), -220, sx - 16 * Math.sin(t * 2 + ph + j), -250, sx + 6, -290); k.stroke(); }
  k.restore();
}
function bubble(k, t, t0) {
  k.save(); k.translate(0, -40);
  k.shadowColor = 'rgba(74,32,112,0.25)'; k.shadowBlur = 20; k.shadowOffsetY = 8;
  k.fillStyle = '#FFFFFF'; rr(k, -150, -190, 300, 170, 70); k.fill();
  k.beginPath(); k.moveTo(-60, -26); k.lineTo(-96, 30); k.lineTo(-10, -26); k.fill(); k.restore();
  k.save(); k.translate(0, -40);
  // dots trail off: they appear, then fade one by one from the right
  for (let i = 0; i < 3; i++) {
    const a = seg(t, t0 + 0.55 + i * 0.22, 0.25, 'back.out(3)'), f = 1 - 0.85 * seg(t, t0 + 1.4 + (2 - i) * 0.25, 0.4);
    k.fillStyle = `rgba(34,16,63,${a * f})`; k.beginPath(); k.arc(-70 + i * 70, -105, 20 * a, 0, TAU); k.fill();
  }
  k.restore();
}
function drawObj(k, i, t) {
  if (i > 3) return;
  const o = OBJ[i], d = dropAt(t, o); if (!d.show) return;
  shadow(k, o.x, o.y, [210, 225, 250, 190][i], clamp(1 + d.dy / 900, 0, 1));
  k.save(); k.translate(o.x, o.y + d.dy); k.rotate(d.rot * (i % 2 ? -1 : 1)); k.scale(d.sx * 1.25, d.sy * 1.25);
  if (i === 0) colander(k);
  if (i === 1) glasses(k);
  if (i === 2) { mug(k, -80, '#9A68D6', '#6B3AA0', t, 0); mug(k, 84, '#F7B6CD', '#E8628F', t, 2); }
  if (i === 3) bubble(k, t, STEP[3]);
  k.restore();
}

// ---- text ----
const wt = document.getElementById('wt'), st = document.getElementById('st'), TB = TYPE.block;
function stepBlock(html, i, size, sh) {
  const b = TB(wt, html, { left: tx(i) + 40, top: 0, width: 1400, size, align: 'left', lh: 1.04 });
  b.el.classList.add('step');
  (sh || []).forEach((v, j) => b.el.style.setProperty('--s' + (j + 1), v + 'px'));
  b.el.style.top = (ty(i) - 210) + 'px'; b.el.style.transform = 'translateY(-100%)';
  return b;
}
const hook = TB(wt, 'Why did I|come|upstairs?', { left: 3740, top: -1150, width: 1400, size: 150, align: 'left', lh: 1.02 });
hook.el.classList.add('step'); [[1, 150], [2, 75], [3, 0]].forEach(([j, v]) => hook.el.style.setProperty('--s' + j, v + 'px'));
const sb = [
  stepBlock('The word for|<span style="font-size:1.2em">colander.</span>', 0, 124, [60, 0]),
  stepBlock('My glasses.|<span class="sans" style="font-size:66px;letter-spacing:0">They were on my head.</span>', 1, 124, [50, 0]),
  stepBlock('Her name.|<span class="sans" style="font-size:66px;letter-spacing:0">We’ve been friends</span>|<span class="sans" style="font-size:66px;letter-spacing:0">for twenty years.</span>', 2, 124, [80, 40, 0]),
  stepBlock('What I was|saying.|<span class="sans" style="font-size:66px;letter-spacing:0">Mid-sentence.</span>', 3, 124, [80, 40, 0]),
  stepBlock('Why I came|upstairs.', 4, 140, [110, 0]),
];
const f1 = TB(st, 'Problems with|memory and|concentration', { left: 100, top: 300, width: 900, size: 116, align: 'left', lh: 1.04 });
f1.el.classList.add('step'); [[1, 120], [2, 60], [3, 0]].forEach(([j, v]) => f1.el.style.setProperty('--s' + j, v + 'px'));
const f1b = TB(st, 'are on the NHS list.', { left: 100, top: 690, width: 900, size: 68, align: 'left', cls: 'sans' });
const f2 = TB(st, 'It’s called|<i>brain fog</i>.', { left: 110, top: 330, width: 900, size: 160, align: 'left', lh: 1.02 });
f2.el.classList.add('step'); [[1, 160], [2, 0]].forEach(([j, v]) => f2.el.style.setProperty('--s' + j, v + 'px'));
const src = TB(st, 'Source: NHS', { left: 110, top: 800, width: 600, size: 46, align: 'left', cls: 'src' });
const cl = TB(st, 'Send this to|the friend who|finishes your|sentences.', { left: 96, top: 270, width: 950, size: 112, align: 'left', lh: 1.03 });
cl.el.classList.add('step'); [[1, 180], [2, 120], [3, 60], [4, 0]].forEach(([j, v]) => cl.el.style.setProperty('--s' + j, v + 'px'));

// ---- dust motes in the sunbeam (screen space) ----
const mr = S.rng(5); const MOTES = Array.from({ length: 34 }, () => ({ x: mr() * W, y: mr() * H, s: 1.5 + mr() * 3.5, v: 8 + mr() * 18, ph: mr() * TAU }));
const pr = S.rng(19); const PET = Array.from({ length: 10 }, () => ({ x: 200 + pr() * 900, d: pr() * 2.5, s: 0.7 + pr() * 0.8, r: pr() * TAU, ph: pr() * TAU }));

window.__timelines["main"] = S.play(function render(t) {
  const cam = camera(t), z = cam.z;
  const pink = seg(t, TURN + 0.2, 1.6, 'power2.inOut');
  c.setTransform(1, 0, 0, 1, 0, 0);
  const M = [z, 0, 0, z, cam.P[0] - cam.F[0] * z, cam.P[1] - cam.F[1] * z];
  // far layer (pictures, window) with a little parallax
  const par = 1.0, Mp = [z, 0, 0, z, cam.P[0] - (cam.F[0] * par + 2150 * (1 - par)) * z, cam.P[1] - (cam.F[1] * par + 560 * (1 - par)) * z];
  c.setTransform(...M); wall(c, pink);
  c.setTransform(...Mp); windowArt(c, t, pink); frames(c, t, pink);
  c.setTransform(...M); sunbeam(c, pink); handrail(c); stairs(c, pink); door(c, t);
  for (let i = 0; i < 4; i++) drawObj(c, i, t);
  // a single petal drifts down onto the empty top stair
  const pt = t - (STEP[4] + 0.2);
  if (pt > 0) { const u = clamp(pt / 1.6, 0, 1), e = S.ease('power2.out')(u); A.petal(c, tx(4) + 520 + 120 * Math.sin(e * 5) * (1 - e), mix(ty(4) - 700, ty(4) - 30, e), 1.5, 0.6 + e * 3, 1); }
  c.setTransform(1, 0, 0, 1, 0, 0);
  // motes
  MOTES.forEach(m => { const y = (m.y - t * m.v + H) % H, x = m.x + 14 * Math.sin(t * 0.8 + m.ph); c.fillStyle = `rgba(255,248,236,${0.45 + 0.3 * Math.sin(t * 2 + m.ph)})`; c.beginPath(); c.arc(x, y, m.s, 0, TAU); c.fill(); });
  // soft light wash over the wide shot so the type above the stairs reads
  if (cam.wide > 0) {
    const g = c.createLinearGradient(0, 200, 0, 1150); g.addColorStop(0, `rgba(255,248,240,${0.55 * cam.wide})`); g.addColorStop(0.8, `rgba(255,248,240,${0.4 * cam.wide})`); g.addColorStop(1, 'rgba(255,248,240,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, 1200);
  }
  // petals across the close
  if (t > CLOSE) PET.forEach(p => { const u = t - CLOSE - p.d; if (u < 0) return; A.petal(c, p.x - u * 60 + 30 * Math.sin(u + p.ph), -60 + u * 230, p.s, p.r + u * 1.5, 0.9); });

  wt.style.transform = `matrix(${M.join(',')})`;
  // type on the stairs
  TYPE.show(hook, t, 0.15, 2.25, { stag: 0.12, dur: 0.8 });
  sb.forEach((b, i) => {
    TYPE.show(b, t, STEP[i] + 0.35, i < 4 ? STEP[i + 1] + 0.35 : TURN + 0.1, { stag: 0.1, outDur: 0.5, outDy: 0 });
  });
  TYPE.show(f1, t, TURN + 0.85, FACT2 - 0.1, { stag: 0.1 });
  TYPE.show(f1b, t, TURN + 1.25, FACT2 - 0.1);
  TYPE.show(f2, t, FACT2 + 0.1, CLOSE - 0.1, { stag: 0.14 });
  TYPE.show(src, t, TURN + 1.5, CLOSE - 0.1);
  TYPE.show(cl, t, CLOSE + 0.15, null, { stag: 0.11 });
}, { loop: false });
</script>
