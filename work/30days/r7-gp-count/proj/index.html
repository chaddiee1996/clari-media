<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,600;1,9..144,700&family=Figtree:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="studio.js"></script>
<script src="clari-art.js"></script>
<style>
  :root { --night: #22103F; --plum: #4A2070; --violet: #7A45B5; --cream: #FFF8EC; --rose: #B83A68; --ink: #241A33; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #C6A9EA; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #C6A9EA; }
  .abs { position: absolute; }
  #c { left: 0; top: 0; width: 1080px; height: 1920px; }
  .F { font-family: 'Fraunces', serif; font-variation-settings: "opsz" 144; }
  .hook { left: -20px; width: 1080px; text-align: center; font-weight: 800; font-size: 116px; line-height: 140px; color: var(--night); letter-spacing: -0.02em; }
  .hook i, .close i { font-style: italic; font-weight: 600; color: var(--rose); }
  .w { display: inline-block; will-change: transform, opacity; }
  .hl { background-image: linear-gradient(transparent 58%, rgba(247,182,205,.85) 58%, rgba(247,182,205,.85) 92%, transparent 92%); background-repeat: no-repeat; background-size: 0% 100%; padding: 0 6px; margin: 0 -6px; }
  #pile { left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 1000px; }
  .card { position: absolute; left: 110px; top: 610px; width: 860px; height: 820px; border-radius: 38px;
    background: linear-gradient(180deg, #FFFCF5 0%, #F7EFE2 100%);
    box-shadow: 0 44px 90px rgba(16, 4, 40, .34), 0 6px 18px rgba(16, 4, 40, .16), inset 0 2px 0 rgba(255, 255, 255, .9);
    transform-origin: 430px 410px; }
  .card .rules { position: absolute; left: 0; right: 0; top: 214px; bottom: 40px;
    background: repeating-linear-gradient(180deg, transparent 0 87px, rgba(122, 69, 181, .16) 87px 90px); }
  .card .red { position: absolute; left: 0; right: 0; top: 196px; height: 4px; background: rgba(184, 58, 104, .55); }
  .tab { position: absolute; top: -112px; width: 230px; height: 124px; border-radius: 30px 30px 0 0;
    background: linear-gradient(180deg, #7A45B5, #4A2070); color: var(--cream); text-align: center;
    font-weight: 800; font-size: 88px; line-height: 124px; box-shadow: 0 -8px 24px rgba(16, 4, 40, .18); }
  .head { position: absolute; left: 64px; top: 66px; font-weight: 800; font-size: 92px; line-height: 110px; color: var(--ink); letter-spacing: -0.015em; white-space: nowrap; }
  .body { position: absolute; left: 64px; top: 246px; width: 760px; font-weight: 700; font-size: 88px; line-height: 104px; color: var(--ink); letter-spacing: -0.01em; }
  .phone { position: absolute; left: 540px; top: 330px; width: 292px; height: 633px; border-radius: 52px; background: #16101F; padding: 10px;
    box-shadow: 0 40px 80px rgba(16, 4, 40, .45); transform: rotate(5deg); }
  .phone img { width: 272px; height: 589px; border-radius: 43px; display: block; }
  .qmi { font-size: 130px; line-height: 0; color: var(--rose); position: relative; top: 46px; margin-left: 6px; }
  .qm { position: absolute; font-weight: 700; font-size: 300px; line-height: 300px; color: var(--rose); }
  .quote { position: absolute; left: 64px; top: 330px; width: 780px; font-weight: 700; font-size: 75px; line-height: 98px; color: var(--ink); letter-spacing: -0.01em; }
  .close { left: 0; width: 1080px; text-align: center; font-weight: 800; font-size: 116px; line-height: 136px; color: var(--night); letter-spacing: -0.02em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="26.6" data-width="1080" data-height="1920">
  <canvas id="c" class="abs" width="1080" height="1920"></canvas>
  <div id="hook" class="abs hook F" style="top:330px">
    <span class="w" data-t="0.0">GP</span> <span class="w" data-t="0.54">appointments</span><br>
    <span class="w" data-t="0.84">go</span> <span class="w" data-t="1.32"><i>fast</i>.</span>
  </div>
  <div id="pile" class="abs">
    <div class="card F" id="c1"><div class="red"></div><div class="rules"></div><div class="tab F" style="left:46px">1</div>
      <div class="head"><span class="w" data-t="5.36">When</span> <span class="w" data-t="5.48">you</span> <span class="w" data-t="5.66">book</span></div>
      <div class="body" id="b1a"><span class="w" data-t="6.28">Ask</span> <span class="hl" data-h="6.75"><span class="w" data-t="6.6">which</span> <span class="w" data-t="6.9">GP</span></span><br><span class="w" data-t="7.32">is</span> <span class="w" data-t="7.62">best</span> <span class="w" data-t="7.84">to</span> <span class="w" data-t="8.06">see</span><br><span class="w" data-t="8.26">about</span> <span class="hl" data-h="8.55"><span class="w" data-t="8.5">menopause.</span></span></div>
      <div class="body" id="b1b"><span class="w" data-t="9.72">Ask</span> <span class="w" data-t="9.94">for</span> <span class="w" data-t="10.14">a</span><br><span class="hl" data-h="10.3"><span class="w" data-t="10.28">longer</span> <span class="w" data-t="10.54">slot,</span></span><br><span class="w" data-t="10.9">if</span> <span class="w" data-t="11.12">you</span> <span class="w" data-t="11.26">can.</span></div>
    </div>
    <div class="card F" id="c2"><div class="red"></div><div class="rules"></div><div class="tab F" style="left:315px">2</div>
      <div class="head"><span class="w" data-t="13.02">Bring</span> <span class="w" data-t="13.18">a</span> <span class="w" data-t="13.34">record</span></div>
      <div class="body" style="width:480px;font-size:76px;line-height:110px;top:262px"><span class="w" data-t="14.38">Each</span> <span class="hl" data-h="14.6"><span class="w" data-t="14.58">symptom.</span></span><br><span class="w" data-t="15.54">How</span> <span class="hl" data-h="15.76"><span class="w" data-t="15.74">often.</span></span><br><span class="w" data-t="16.44">How</span> <span class="hl" data-h="16.68"><span class="w" data-t="16.66">strong.</span></span></div>
      <div class="phone" id="ph"><img src="media/summary.png" alt=""></div>
    </div>
    <div class="card F" id="c3"><div class="red"></div><div class="rules"></div><div class="tab F" style="left:584px">3</div>
      <div class="head"><span class="w" data-t="18.66">Say</span> <span class="w" data-t="18.9">it</span> <span class="w" data-t="19.06">plainly</span></div>
      <div class="qm F w" data-t="20.0" style="left:40px;top:190px">&ldquo;</div>
      <div class="quote" id="q"><span class="w" data-t="20.18">I</span> <span class="w" data-t="20.24">think</span> <span class="w" data-t="20.48">this</span><br><span class="w" data-t="20.66">could</span> <span class="w" data-t="20.86">be</span> <span class="hl" data-h="21.3"><span class="w" data-t="21.02">perimenopause.</span></span><br><span class="w" data-t="22.34">What</span> <span class="w" data-t="22.44">are</span> <span class="w" data-t="22.56">my</span> <span class="hl" data-h="22.75"><span class="w" data-t="22.72">options?</span></span><span class="w qmi" data-t="22.9">&rdquo;</span></div>
    </div>
  </div>
  <canvas id="fg" class="abs" width="1080" height="1920" style="left:0;top:0;width:1080px;height:1920px"></canvas>
  <div id="close" class="abs close F" style="top:280px">
    <span class="w" data-t="23.74">Save</span> <span class="w" data-t="24.22">this</span> <span class="w" data-t="24.52">for</span><br>
    <span class="w" data-t="24.78">the</span> <span class="w" data-t="24.92">day</span> <span class="w" data-t="25.1">you</span> <span class="w" data-t="25.28">book.</span>
  </div>
</div>
<script>
const S = STUDIO, C = CLARI, W = 1080, H = 1920, TAU = Math.PI * 2, D = 26.6;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const $ = id => document.getElementById(id);
const WORDS = [...document.querySelectorAll('.w')].map(el => ({ el, t: +el.dataset.t }));
const HLS = [...document.querySelectorAll('.hl')].map(el => ({ el, t: +el.dataset.h }));
const CARDS = [{ el: $('c1'), t: 4.55, rot: -2.2 }, { el: $('c2'), t: 11.85, rot: 1.6 }, { el: $('c3'), t: 17.45, rot: -0.8 }];
const T_STOP = 3.34, T_PARK = 4.05, T_CLOSE = 23.45;
const mk = (w, h) => { const k = document.createElement('canvas'); k.width = w; k.height = h; return k; };
const sky = mk(W, 2200); let built = false;
const CLOUDS = Array.from({ length: 7 }, (_, i) => { const r = S.rng(40 + i); return { x: r() * 1300 - 100, y: 200 + r() * 1100, s: 0.6 + r() * 0.9, f: 0.08 + r() * 0.3, sp: 6 + r() * 10 }; });
function cloud(k, x, y, s, a) {
  k.save(); k.translate(x, y); k.scale(s, s); k.globalAlpha = a;
  const g = k.createLinearGradient(0, -90, 0, 60); g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(241,234,247,0.8)');
  k.fillStyle = g; k.beginPath(); k.arc(-90, 10, 60, 0, TAU); k.arc(-20, -30, 82, 0, TAU); k.arc(70, -6, 66, 0, TAU); k.arc(140, 22, 44, 0, TAU); k.fill();
  k.fillRect(-150, 10, 330, 56); k.restore();
}
function stopwatch(k, x, y, r, ang, press, t) {
  k.save(); k.translate(x, y);
  // crown + side button
  k.save(); k.translate(0, press * r * 0.05);
  const gg = k.createLinearGradient(-r * 0.14, 0, r * 0.14, 0); gg.addColorStop(0, '#D9A85E'); gg.addColorStop(0.5, '#FFE29A'); gg.addColorStop(1, '#C9914A');
  k.fillStyle = gg; C.rr(k, -r * 0.1, -r * 1.25, r * 0.2, r * 0.2, r * 0.04); k.fill(); C.rr(k, -r * 0.2, -r * 1.36, r * 0.4, r * 0.13, r * 0.06); k.fill();
  k.restore();
  k.save(); k.rotate(0.78); k.fillStyle = gg; C.rr(k, -r * 0.07, -r * 1.17, r * 0.14, r * 0.16, r * 0.04); k.fill(); k.restore();
  // body
  k.shadowColor = 'rgba(16,4,40,0.35)'; k.shadowBlur = r * 0.3; k.shadowOffsetY = r * 0.12;
  const bg = k.createLinearGradient(0, -r, 0, r); bg.addColorStop(0, '#7A45B5'); bg.addColorStop(1, '#4A2070');
  k.fillStyle = bg; k.beginPath(); k.arc(0, 0, r * 1.1, 0, TAU); k.fill(); k.shadowColor = 'transparent';
  const fg = k.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
  fg.addColorStop(0, '#FFFFFF'); fg.addColorStop(0.6, '#FFF8EC'); fg.addColorStop(1, '#EADCEF');
  k.fillStyle = fg; k.beginPath(); k.arc(0, 0, r * 0.96, 0, TAU); k.fill();
  // ticks
  for (let i = 0; i < 60; i++) { const a = i / 60 * TAU, big = i % 5 === 0;
    k.strokeStyle = big ? '#4A2070' : 'rgba(74,32,112,0.45)'; k.lineWidth = big ? r * 0.024 : r * 0.01;
    k.beginPath(); k.moveTo(Math.sin(a) * r * (big ? 0.76 : 0.82), -Math.cos(a) * r * (big ? 0.76 : 0.82)); k.lineTo(Math.sin(a) * r * 0.9, -Math.cos(a) * r * 0.9); k.stroke(); }
  // sub-dial with a tiny Clari crescent
  k.strokeStyle = 'rgba(74,32,112,0.35)'; k.lineWidth = r * 0.012; k.beginPath(); k.arc(0, r * 0.38, r * 0.17, 0, TAU); k.stroke();
  C.moon(k, -r * 0.01, r * 0.38, r * 0.09, { glow: 0 });
  // sweep: a pink trail then the hand
  k.save(); k.rotate(ang);
  const trail = Math.min(1.6, Math.max(0, 1.6 * (1 - S.seg(t, T_STOP, 0.2, 'power2.out'))));
  if (trail > 0.02) { k.fillStyle = 'rgba(247,182,205,0.45)'; k.beginPath(); k.moveTo(0, 0); k.arc(0, 0, r * 0.84, -Math.PI / 2 - trail, -Math.PI / 2); k.closePath(); k.fill(); }
  k.strokeStyle = '#B83A68'; k.lineWidth = r * 0.03; k.lineCap = 'round';
  k.beginPath(); k.moveTo(0, r * 0.16); k.lineTo(0, -r * 0.84); k.stroke();
  k.restore();
  k.fillStyle = '#4A2070'; k.beginPath(); k.arc(0, 0, r * 0.06, 0, TAU); k.fill();
  k.fillStyle = '#FFE29A'; k.beginPath(); k.arc(0, 0, r * 0.025, 0, TAU); k.fill();
  k.restore();
}
function handAngle(t) {
  if (t < T_STOP) return TAU * (t * 0.9 + t * t * 0.32);
  const a0 = TAU * (T_STOP * 0.9 + T_STOP * T_STOP * 0.32);
  const rec = -0.05 * Math.exp(-(t - T_STOP) * 9) * Math.sin((t - T_STOP) * 30);
  // after parking, one tick per beat (96 bpm) like a real stopwatch
  const beats = Math.max(0, (t - 5) * 1.6), step = Math.floor(beats) + S.ease('power4.out')(beats % 1);
  return a0 + rec + step * TAU / 60;
}
const fgc = document.getElementById('fg').getContext('2d');
const FP = Array.from({ length: 9 }, (_, i) => { const r = S.rng(70 + i); return { x: 1150 + r() * 300, y: 200 + r() * 900, s: 1.2 + r() * 1.3, d: r() * 0.9, ph: r() * TAU, sp: 520 + r() * 240 }; });
function render(t) {
  if (!built) { C.sky(sky.getContext('2d'), 'day', W, 2200, { glowX: 760, glowY: 300, glowR: 900, glow: 0.2 }); built = true; }
  const push = 1 + 0.04 * S.seg(t, 0, D, 'sine.inOut');
  // settle bump on each card landing
  let bump = 0; CARDS.forEach(cd => { const a = t - cd.t - 0.55; if (a > 0) bump += 10 * Math.exp(-a * 5) * Math.sin(a * 14); });
  const camY = 60 * S.seg(t, 0, D, 'sine.inOut') + bump;
  c.setTransform(push, 0, 0, push, 540 * (1 - push), 960 * (1 - push));
  c.drawImage(sky, 0, -120 - camY * 0.15);
  C.stars(c, W, H, t, { seed: 12, n: 0, sparkles: 5, alpha: 0.7, top: 0.1, bottom: 0.6 });
  CLOUDS.forEach(cl => cloud(c, ((cl.x + t * cl.sp) % 1400) - 150, cl.y - camY * cl.f, cl.s, 0.5 + cl.f));
  C.hills(c, W, H, 'day', { y: 40 - camY * 0.3 });
  C.branch(c, 1100, 40 - camY * 0.45, 2.2, true, t, { blossoms: 7 });
  // stopwatch: big in the hook, then parks top-left and keeps ticking
  const pk = S.seg(t, T_PARK, 0.9, 'expo.inOut');
  const sx = S.mix(540, 196, pk), sy = S.mix(1150, 372, pk), sr = S.mix(330, 92, pk);
  const press = Math.sin(Math.PI * S.seg(t, T_STOP - 0.08, 0.5, 'power1.inOut'));
  const shake = t < T_STOP ? 2.4 * Math.sin(t * 70) * S.seg(t, 0, T_STOP, 'power2.in') : 0;
  const so = S.seg(t, T_CLOSE - 0.1, 0.6, 'power3.inOut');
  stopwatch(c, sx + shake - so * 420, sy - camY * 0.2 * pk - so * 60, sr * (1 + 0.015 * press), handAngle(t), press, t);
  // foreground petals drift across during the quote
  fgc.clearRect(0, 0, W, H);
  FP.forEach(q => { const a = t - 20.4 - q.d; if (a < 0 || a > 4) return; const x = q.x - a * q.sp, y = q.y + a * 160 + 30 * Math.sin(a * 2 + q.ph); C.petal(fgc, x, y, q.s, q.ph + a * 1.8, 0.92); });
  // words
  WORDS.forEach(({ el, t: wt }) => { const p = S.seg(t, wt - 0.05, 0.34, 'power3.out');
    el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 44}px)`; });
  HLS.forEach(({ el, t: ht }) => { el.style.backgroundSize = `${100 * S.seg(t, ht, 0.55, 'power2.inOut')}% 100%`; });
  const hk = S.seg(t, T_PARK - 0.15, 0.45, 'power3.in');
  $('hook').style.transform = `translateY(${-hk * 160}px)`; $('hook').style.opacity = 1 - hk;
  // card 1 body lines: line A steps back when line B starts (keeps the word count low)
  const la = S.seg(t, 9.4, 0.32, 'power3.in'); $('b1a').style.opacity = 1 - la; $('b1a').style.transform = `translateY(${-40 * la}px)`;
  // cards land on the pile
  CARDS.forEach((cd, i) => {
    const p = S.seg(t, cd.t, 0.85, 'expo.out');
    let y = (1 - p) * 1150, rot = cd.rot + (1 - p) * 7;
    // pushed down a little by every card that lands on top
    for (let j = i + 1; j < CARDS.length; j++) { const q = S.seg(t, CARDS[j].t + 0.18, 0.5, 'power2.out'); y += 14 * q; rot += (i % 2 ? 0.5 : -0.5) * q; }
    const sq = 0.015 * Math.exp(-Math.max(0, t - cd.t - 0.5) * 6) * (t > cd.t + 0.5 ? 1 : 0);
    cd.el.style.transform = `translateY(${y}px) rotate(${rot}deg) scale(${1 + sq}, ${1 - sq})`;
    cd.el.style.visibility = p > 0 ? 'visible' : 'hidden';
  });
  const ph = S.seg(t, 13.55, 0.9, 'expo.out'), phOut = S.seg(t, 17.5, 0.4, 'power2.in');
  $('ph').style.transform = `translateY(${(1 - ph) * 260}px) rotate(${5 + (1 - ph) * 6}deg)`; $('ph').style.opacity = ph * (1 - phOut);
  // close: the pile settles lower and smaller, the quote steps back, the line lands on top
  const cl = S.seg(t, T_CLOSE, 1.0, 'expo.inOut');
  $('pile').style.transform = `translateY(${cl * 240}px) scale(${1 - 0.22 * cl})`;
  
}
window.__timelines = window.__timelines || {};
window.__timelines["main"] = S.play(render, { loop: false });
</script>
