.light .counter,.light .src{color:var(--ink)}

<script>
const W=1080, H=1920, N=1, PW=1080;
const c=document.getElementById('art').getContext('2d'); const c2=document.getElementById('art2').getContext('2d');
const IM={};
function loadAll(list){return Promise.all(list.map(n=>new Promise(r=>{const i=new Image();i.onload=()=>r();i.onerror=()=>r();i.src='../assets/'+n;IM[n]=i;})));}
function show(i){document.getElementById('stage').style.transform='translateX('+(-i*W)+'px)';}
function draw(){ const g=c.createLinearGradient(0,0,0,H); const s=["#34226D", "#6F4CAD", "#CB85B8", "#F7B2A8", "#FFDEB8"]; [0,.36,.66,.86,1].forEach((p,k)=>g.addColorStop(p,s[k])); c.fillStyle=g; c.fillRect(0,0,W,H);CLARI.stars(c,W,H,0.5,{seed:14,n:110,bottom:0.4,alpha:0.70,sparkles:5});const x=842, y=1440, r=110; const gl=c.createRadialGradient(x,y,r*0.4,x,y,r*4.5); gl.addColorStop(0,'rgba(255,236,190,0.6)'); gl.addColorStop(1,'rgba(255,236,190,0)'); c.fillStyle=gl; c.fillRect(0,0,W,H);const dd=c.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r); dd.addColorStop(0,'#FFFBEA'); dd.addColorStop(1,'#FFD9A0'); c.fillStyle=dd; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); }
Promise.all([document.fonts.ready, loadAll([])]).then(()=>{ if(typeof draw==='function') draw(); show(0); window.__ready=true; });
