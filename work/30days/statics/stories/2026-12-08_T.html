<!doctype html><html><head><meta charset="utf-8"><title>Clari story</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--night:#22103F;--plum:#4A2070;--violet:#7A45B5;--lilac:#C3A8EA;--cream:#FFF8EC;--pink:#F7B6CD;
--blossom:#E8628F;--rose:#B83A68;--gold:#FFEFC9;--paper:#FBF6EE;--ink:#241A33;--deep:#2A1548}
html,body{margin:0;padding:0;overflow:hidden;background:#22103F}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#art,#svg{position:absolute;left:0;top:0}
.cell{position:absolute;top:0;box-sizing:border-box;display:flex;flex-direction:column}
.cell>*{flex-shrink:0}
.abs{position:absolute}
.h{font-family:'Fraunces',serif;font-weight:700;font-variation-settings:"opsz" 144;letter-spacing:-0.012em;word-spacing:0.05em;line-height:1.04;margin:0;color:var(--cream)}
.h em{font-style:italic;font-weight:600;color:var(--pink);letter-spacing:-0.01em}
.light .h{color:var(--ink)} .light .h em{color:var(--rose)}
.s{font-family:'Figtree',sans-serif;font-weight:700;color:var(--cream);margin:0;line-height:1.25}
.light .s{color:var(--ink)}
.lab{font-family:'Figtree',sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin:0}
.hand{font-family:'Caveat',cursive;font-weight:700;line-height:1.05}
.chrome-mark{position:absolute;height:86px}
.counter{position:absolute;font-family:'Figtree',sans-serif;font-weight:700;font-size:42px;letter-spacing:.04em;color:var(--cream);opacity:.9;line-height:86px;font-variant-numeric:tabular-nums}
.src{position:absolute;font-family:'Figtree',sans-serif;font-weight:700;font-size:44px;color:var(--cream);opacity:.92;line-height:1.15;margin:0}
.light .counter,.light .src{color:var(--ink)}
.lock{position:absolute}

html,body{width:1080px;height:1920px;background:#22103F}
</style></head>
<body class="dark"><div id="stage" style="width:1080px;height:1920px">
<canvas id="art" width="1080" height="1920"></canvas>
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="glowW"><stop offset="0" stop-color="#FFF6DD" stop-opacity=".9"/><stop offset=".35" stop-color="#F9C9D8" stop-opacity=".35"/><stop offset="1" stop-color="#F9C9D8" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowP"><stop offset="0" stop-color="#F9C9D8" stop-opacity=".55"/><stop offset=".5" stop-color="#F9C9D8" stop-opacity=".16"/><stop offset="1" stop-color="#F9C9D8" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowHot"><stop offset="0" stop-color="#FFF3D6" stop-opacity="1"/><stop offset=".18" stop-color="#FFD9A8" stop-opacity=".75"/><stop offset=".45" stop-color="#F59AB8" stop-opacity=".28"/><stop offset="1" stop-color="#E8628F" stop-opacity="0"/></radialGradient>

<canvas id="art2" width="1080" height="1920" style="position:absolute;left:0;top:0"></canvas>
<div class="cell" style="left:0;width:1080px;height:1920px;padding:370px 170px 0 88px"><p class="lab" style="font-size:50px;color:var(--pink);letter-spacing:.18em">Today on our feed</p></div><div class="abs" style="left:190px;top:480px;width:600px;height:750px;border-radius:36px;overflow:hidden;transform:rotate(-2.5deg);box-shadow:0 40px 80px rgba(16,4,40,.5), 0 0 0 14px #FFF8EC"><img src="../assets/still_r13.jpg" style="display:block;width:600px;height:750px;object-fit:cover"><div style="position:absolute;left:36px;bottom:36px;width:110px;height:110px;border-radius:50%;background:rgba(255,248,236,.88);display:flex;align-items:center;justify-content:center"><svg width="44" height="48" viewBox="0 0 60 64"><path d="M8 4 L56 32 L8 60Z" fill="#4A2070"/></svg></div></div><div class="abs" style="left:590px;top:1180px;transform:rotate(4deg);background:#F7B6CD;border-radius:60px;padding:22px 40px;box-shadow:0 14px 30px rgba(16,4,40,.35)"><p class="lab" style="font-size:48px;color:#22103F;letter-spacing:.12em">New post</p></div><div class="cell" style="left:0;width:1080px;height:1920px;padding:1310px 170px 420px 88px">
        <h2 class="h" style="font-size:88px;line-height:1.04">A new question at your NHS <em>Health Check.</em></h2>
        <p class="s" style="font-size:52px;margin-top:22px;color:var(--pink)">New on our feed.</p></div><img class="chrome-mark" src="../assets/mark.png" style="left:88px;top:230px">
</div>
<script src="../assets/clari-art.js"></script>
<script>
const W=1080, H=1920, N=1, PW=1080;
const c=document.getElementById('art').getContext('2d'); const c2=document.getElementById('art2').getContext('2d');
const IM={};
function loadAll(list){return Promise.all(list.map(n=>new Promise(r=>{const i=new Image();i.onload=()=>r();i.onerror=()=>r();i.src='../assets/'+n;IM[n]=i;})));}
function show(i){document.getElementById('stage').style.transform='translateX('+(-i*W)+'px)';}
function draw(){const g=c.createLinearGradient(0,0,0,H); const s=['#120723','#2C1252','#4A2180','#6F3FA6','#8E57BE']; [0,.36,.66,.86,1].forEach((p,k)=>g.addColorStop(p,s[k])); c.fillStyle=g; c.fillRect(0,0,W,H);CLARI.stars(c,W,H,0.5,{seed:5,n:220,bottom:0.95,alpha:0.8,sparkles:10}); }
Promise.all([document.fonts.ready, loadAll([])]).then(()=>{ if(typeof draw==='function') draw(); show(0); window.__ready=true; });
</script></body></html>
