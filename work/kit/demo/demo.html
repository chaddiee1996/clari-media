<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Figtree:wght@600;700;800&display=swap">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../art/clari-art.js"></script>
<script>
const c=document.getElementById('c').getContext('2d'), W=1080,H=1920;
const img=CLARI.loadImg('../screens/home.png');
function draw(){
 CLARI.sky(c,'evening',W,H,{glowX:780,glowY:330});
 CLARI.stars(c,W,H,1.2,{seed:5,n:120,bottom:0.55});
 CLARI.moon(c,790,330,150);
 CLARI.branch(c,-20,120,3.0,false,0,{});
 CLARI.hills(c,W,H,'evening');
 CLARI.phone(c,img,540,1300,430,{rot:-0.06});
 CLARI.rich(c,[['You deserve to be ','b'],['heard.','i']],540,720,{size:92});
 CLARI.blossom(c,860,1500,1.4,0.3,{open:1});
 CLARI.petal(c,300,900,1.2,0.6,0.9);
}
document.fonts.ready.then(()=>{ if(img.complete) draw(); else img.onload=draw; });
</script></body></html>
