<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Figtree:wght@600;700;800&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="studio.js"></script>
<style>
  :root { --cream: #FFF8EC; --pink: #F7B6CD; --sky0: #7A45B5; --sky1: #4A2180; --sky2: #22103F; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--sky2); }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--sky2); }
  .abs { position: absolute; }
  #c { left: 0; top: 0; width: 1080px; height: 1920px; }
  #tile { left: 340px; top: 560px; width: 400px; height: 400px; border-radius: 92px; overflow: hidden;
    box-shadow: 0 40px 90px rgba(10, 2, 30, .55), 0 0 0 2px rgba(255, 255, 255, .10) inset; }
  #tile img { width: 100%; height: 100%; display: block; }
  #wmask { left: 0; top: 1010px; width: 1080px; height: 270px; overflow: hidden; }
  #word { width: 1080px; text-align: center; font-family: 'Fraunces', serif; font-weight: 600; font-size: 230px;
    line-height: 260px; letter-spacing: -0.02em; color: var(--cream); font-variation-settings: "opsz" 144; }
  #tag { left: 0; top: 1300px; width: 1080px; text-align: center; font-family: 'Figtree', sans-serif; font-weight: 700;
    font-size: 58px; color: var(--cream); }
  #tag i { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; color: var(--pink); }
  #rule { left: 470px; top: 1408px; width: 140px; height: 6px; border-radius: 3px; background: var(--pink); }
  #free { left: 0; top: 1450px; width: 1080px; text-align: center; font-family: 'Figtree', sans-serif; font-weight: 700;
    font-size: 48px; color: var(--cream); opacity: .9; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <canvas id="c" class="abs" width="1080" height="1920"></canvas>
  <div id="tile" class="abs"><img src="media/icon.png" alt=""></div>
  <div id="wmask" class="abs"><div id="word">Clari</div></div>
  <div id="tag" class="abs">Your <i>private</i> perimenopause diary</div>
  <div id="rule" class="abs"></div>
  <div id="free" class="abs">Free on the App Store and Google Play</div>
</div>
<script>
const S = STUDIO, W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const $ = id => document.getElementById(id);
const tile = $('tile'), word = $('word'), tag = $('tag'), rule = $('rule'), free = $('free');
const r = S.rng(11);
const STARS = Array.from({ length: 150 }, () => [r() * W, r() * H * 0.92, 0.8 + r() * 2.2, r() * TAU, 0.3 + r() * 0.6]);
const SPARK = [[180, 380, 1.4], [890, 300, 1.8], [930, 1150, 1.1], [140, 1240, 1.2], [760, 1680, 1.0], [300, 1760, .9]];
const pr = S.rng(42);
// petals released from the tile at the bloom (t = 0.7)
const PETALS = Array.from({ length: 16 }, () => {
  const a = -Math.PI * (0.15 + pr() * 0.7) + (pr() < 0.5 ? 0 : Math.PI * 0.0);
  return { a: (pr() * TAU), sp: 260 + pr() * 420, rot: pr() * TAU, vr: (pr() - .5) * 4, s: 0.7 + pr() * 0.8, fall: 60 + pr() * 90 };
});
function petal(x, y, s, rot, al) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.globalAlpha = al;
  const g = c.createLinearGradient(0, -26, 0, 0); g.addColorStop(0, '#FFF0F5'); g.addColorStop(1, '#F28DB2');
  c.fillStyle = g; c.beginPath(); c.moveTo(0, 0);
  c.bezierCurveTo(-11, -9, -12, -24, -3, -29); c.lineTo(0, -25); c.lineTo(3, -29); c.bezierCurveTo(12, -24, 11, -9, 0, 0);
  c.fill(); c.restore();
}
function spark(x, y, s, al) {
  c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha = al; c.fillStyle = '#FFF6DD';
  c.beginPath(); c.moveTo(0, -18); c.quadraticCurveTo(0, 0, 18, 0); c.quadraticCurveTo(0, 0, 0, 18);
  c.quadraticCurveTo(0, 0, -18, 0); c.quadraticCurveTo(0, 0, 0, -18); c.fill(); c.restore();
}
window.__timelines["main"] = S.play(function render(t) {
  const fin = S.seg(t, 0, 0.35, 'power2.out');
  // sky: the app icon's own gradient
  const g = c.createLinearGradient(0, 0, W * 0.55, H);
  g.addColorStop(0, '#7A45B5'); g.addColorStop(0.5, '#4A2180'); g.addColorStop(1, '#22103F');
  c.globalAlpha = 1; c.fillStyle = g; c.fillRect(0, 0, W, H);
  // moon-glow behind the tile, breathing slightly
  const gl = c.createRadialGradient(540, 760, 40, 540, 760, 700 + 30 * Math.sin(t * 2.2));
  gl.addColorStop(0, 'rgba(249,201,216,0.42)'); gl.addColorStop(0.45, 'rgba(249,201,216,0.12)'); gl.addColorStop(1, 'rgba(249,201,216,0)');
  c.fillStyle = gl; c.fillRect(0, 0, W, H);
  // stars twinkle
  STARS.forEach(([x, y, rr, ph, a]) => {
    c.globalAlpha = fin * a * (0.55 + 0.45 * Math.sin(t * 3 + ph));
    c.fillStyle = '#FFFFFF'; c.beginPath(); c.arc(x, y + t * 6 * a, rr, 0, TAU); c.fill();
  });
  SPARK.forEach(([x, y, s], i) => spark(x, y, s * (0.85 + 0.15 * Math.sin(t * 2.5 + i)), fin * 0.9));
  // petals burst from the tile at the bloom, then drift down
  const bt = t - 0.7;
  if (bt > 0) PETALS.forEach(p => {
    const e = 1 - Math.exp(-bt * 2.6);
    const x = 540 + Math.cos(p.a) * p.sp * e + Math.sin(bt * 1.4 + p.rot) * 18;
    const y = 760 + Math.sin(p.a) * p.sp * e * 0.75 + p.fall * bt * 0.5;
    petal(x, y, p.s * 1.4, p.rot + p.vr * bt, Math.min(1, bt * 4) * (1 - S.seg(t, 1.9, 0.9, 'power1.in')) * 0.95);
  });
  c.globalAlpha = 1;
  // tile rises in (note 1 at 0.25 s), small settle on the bloom (note 2 at 0.7 s)
  const tp = S.seg(t, 0.22, 0.7, 'expo.out');
  const bump = 0.03 * Math.sin(Math.min(1, Math.max(0, (t - 0.7) / 0.35)) * Math.PI);
  tile.style.opacity = tp;
  tile.style.transform = `translateY(${(1 - tp) * 90}px) scale(${0.9 + 0.1 * tp + bump})`;
  // wordmark rises through a mask (note 3 at 1.1 s)
  const wp = S.seg(t, 1.05, 0.8, 'expo.out');
  word.style.transform = `translateY(${(1 - wp) * 270}px)`;
  const tg = S.seg(t, 1.5, 0.6, 'power3.out');
  tag.style.opacity = tg; tag.style.transform = `translateY(${(1 - tg) * 30}px)`;
  const rl = S.seg(t, 1.7, 0.6, 'expo.out');
  rule.style.transform = `scaleX(${0.2 + 0.8 * rl})`; rule.style.opacity = rl;
  const fr = S.seg(t, 1.9, 0.6, 'power3.out');
  free.style.opacity = 0.9 * fr; free.style.transform = `translateY(${(1 - fr) * 24}px)`;
}, { loop: false });
</script>
</body>
</html>
