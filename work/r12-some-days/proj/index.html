<script>
/*
 * Clari R12 "Some days". ink-line look, 9:16, 19 s, text only + music (66 bpm, beat 0.909 s).
 * One sumi line that never lifts, drawn on twos:
 *   0.2-3.6  the line draws a woman's profile, rises out of her hair into a storm cloud, strikes a bolt

    [474, 1265, 12], [486, 1205, 11], [528, 1170, 10], [566, 1152, 10], [578, 1124, 9],                      // throat, chin
    [562, 1100, 7], [580, 1082, 9], [562, 1068, 6], [584, 1050, 9], [570, 1028, 7],                          // lips

    const a = u * Math.PI * 2;

  }, 900);

  // ---------- timing ----------

  // pen-time along the storm: slower on tight curves
  const PCUM = new Float32Array(N); (function () { let acc = 0; for (let j = 1; j < N; j++) { let turn = 0; if (j > 1 && j < N - 1) { const a1 = Math.atan2(STORM.Y[j] - STORM.Y[j - 1], STORM.X[j] - STORM.X[j - 1]), a2 = Math.atan2(STORM.Y[j + 1] - STORM.Y[j], STORM.X[j + 1] - STORM.X[j]); let d = Math.abs(a2 - a1); if (d > Math.PI) d = 2 * Math.PI - d; turn = d; } acc += 1 + 14 * Math.min(turn, 0.5); PCUM[j] = acc; } for (let j = 0; j < N; j++) PCUM[j] /= acc; })();

  // ---------- ink drawing ----------

    { lines: ['Mood changes', 'are on the', 'NHS list.'], align: 'center', x: 540, y: 820, px: 140, t0: 9.8, t1: 12.6 },
    { lines: ["You're not", 'imagining it.'], align: 'center', x: 540, y: 900, px: 150, t0: 13.1, t1: 15.15 },

  // "it's" sits after "Some days" on line two, with rage/tears on line three: re-flow so line 2 reads "it's rage."

  function drawBlock(b, t) {

    // soft bleed, then the body
    ctx.globalAlpha = 0.18 * a; ctx.filter = `blur(${3 + 6 * (1 - inK)}px)`; ctx.drawImage(txt, 0, 0);
    ctx.filter = inK < 1 ? `blur(${2.5 * (1 - inK)}px)` : 'none'; ctx.globalAlpha = 0.97 * a; ctx.drawImage(txt, 0, outK * -10); ctx.filter = 'none'; ctx.globalAlpha = 1;
  }
  function drawSource(t) {
    const k = seg(t, 10.5, 0.7, 'power2.out') * (1 - seg(t, 12.6, 0.45, 'power2.in')); if (k <= 0) return;
    ctx.globalAlpha = k; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = SERIF(700, 50);
    ctx.fillText('Source: Cambridge University', 540, 1370); ctx.fillText('Hospitals NHS', 540, 1430); ctx.globalAlpha = 1;
  }

  // ---------- moon seal ----------
  const seal = document.createElement('canvas'); seal.width = seal.height = 260;
  (function () {
    const s = seal.getContext('2d'), rnd = mulberry(77); s.translate(130, 130);
    s.fillStyle = PLUM; s.beginPath(); s.arc(0, 0, 92, 0, Math.PI * 2); s.fill();
    s.globalCompositeOperation = 'destination-out'; s.beginPath(); s.arc(46, -34, 80, 0, Math.PI * 2); s.fill();
    for (let i = 0; i < 360; i++) { const x = (rnd() - 0.5) * 190, y = (rnd() - 0.5) * 190, r = rnd() < 0.9 ? rnd() * 1.4 : 1 + rnd() * 2.4; s.globalAlpha = 0.35 + rnd() * 0.5; s.beginPath(); s.arc(x, y, r, 0, Math.PI * 2); s.fill(); }
  })();

  function draw(tr) {
    const fr = Math.round(tr * 30), tq = Math.floor(fr / 2) / 15; // the line is drawn on twos
    state(tq);
    const seed = Math.floor(fr / 2);
    for (let i = 0; i < N; i++) { // boil
      S.x[i] += (vn(i * 0.04 + seed * 13.1, 1) - 0.5) * 3.2; S.y[i] += (vn(i * 0.04 + seed * 17.7, 2) - 0.5) * 3.2;
      S.w[i] *= (0.94 + 0.12 * vn(i * 0.03 + seed * 7.3, 4));
    }
    // draw-on
    let hiF = N - 1;
    if (tq < DRAW1) { const p = ez('sine.inOut')(clamp((tq - DRAW0) / (DRAW1 - DRAW0), 0, 1)); let j = 0; while (j < N - 1 && PCUM[j + 1] < p) j++; hiF = j + clamp((p - PCUM[j]) / Math.max(1e-6, PCUM[j + 1] - PCUM[j]), 0, 1); }
    const hi = Math.floor(hiF);
    // camera: a slow drift, one gentle push on the enso
    const sc = 1 + 0.025 * Math.sin(tr * 0.22) * 0 + 0.05 * seg(tr, ENSO0, 3.5, 'sine.inOut');
    const dx = 6 * Math.sin(tr * 0.37), dy = 5 * Math.sin(tr * 0.29 + 1.1);
    const cx = tr > ENSO0 ? lerp(540, EC[0], 1) : 540, cy = lerp(960, EC[1] + 140, seg(tr, ENSO0, 3.5, 'sine.inOut'));
    const M = new DOMMatrix([sc, 0, 0, sc, 540 - sc * cx + dx, 960 - sc * cy + dy + (cy - 960)]);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(M); ctx.drawImage(paper, 0, 0);
    // ink layer
    ictx.setTransform(1, 0, 0, 1, 0, 0); ictx.clearRect(0, 0, W, H); ictx.setTransform(M);
    let hx = S.x[hi], hy = S.y[hi];
    if (hi < N - 1) { const k = hiF - hi; hx = lerp(S.x[hi], S.x[hi + 1], k); hy = lerp(S.y[hi], S.y[hi + 1], k); S.x[hi + 1] = hx; S.y[hi + 1] = hy; }
    const top = Math.min(hi + 1, N - 1);
    if (top > 0) {
      strokeLine(ictx, 0, top, 1); feathers(ictx, 0, top);
      if (hi < N - 1) { ictx.fillStyle = INK; ictx.beginPath(); ictx.arc(hx, hy, Math.max(3, S.w[hi] * 0.7), 0, Math.PI * 2); ictx.fill(); }
      dryCuts(ictx, 0, top);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.09; ctx.filter = 'blur(14px)'; ctx.drawImage(ink, 0, 0);
    ctx.globalAlpha = 0.22; ctx.filter = 'blur(3px)'; ctx.drawImage(ink, 0, 0);
    ctx.filter = 'none'; ctx.globalAlpha = 0.96; ctx.drawImage(ink, 0, 0); ctx.globalAlpha = 1;
    ctx.setTransform(M);
    if (top > 0) { blot(ctx, S.x[0], S.y[0], S.w[0] * 1.6 + 6, 0.2); blot(ctx, hx, hy, S.w[hi] * 1.5 + 6, hi < N - 1 ? 0.3 : 0.14); }
    // words (in screen space, not moved by the camera, for crisp type)
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // line two "it's rage." sits on one line: draw "it's" right-aligned next to the swapping word
    for (const b of BLOCKS) drawBlockFlow(b, tr);
    drawSource(tr);
    // seal + wordmark
    if (tr > SEAL_T - 0.2) {
      ctx.setTransform(M);
      const k = clamp((tr - (SEAL_T - 0.2)) / 0.2, 0, 1), kin = ez('power2.in')(k);
      const settle = tr > SEAL_T ? 1 - 0.015 * Math.exp(-(tr - SEAL_T) * 9) * Math.sin((tr - SEAL_T) * 30) : 1;
      const s2 = lerp(1.25, 1, kin) * settle;
      ctx.save(); ctx.translate(EC[0] - 10, EC[1] + 8); ctx.rotate(-0.06); ctx.scale(s2, s2); ctx.globalAlpha = kin; ctx.globalCompositeOperation = 'multiply';
      ctx.drawImage(seal, -130, -130); ctx.restore(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      const wk = seg(tr, SEAL_T + 0.25, 0.8, 'power2.out');
      if (wk > 0) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, H); tctx.font = SERIF(900, 170); tctx.textAlign = 'center'; tctx.fillStyle = INK;
        const ys = cy + sc * (EC[1] + ER + 210 - cy) + dy;
        tctx.fillText('Clari', 540, ys);
        tctx.globalCompositeOperation = 'destination-in'; const xe = 300 + 600 * wk; const g = tctx.createLinearGradient(xe - 140, 0, xe, 0); g.addColorStop(0, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)'); tctx.fillStyle = g; tctx.fillRect(0, 0, W, H); tctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 0.2; ctx.filter = 'blur(4px)'; ctx.drawImage(txt, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.drawImage(txt, 0, 0);
        ctx.globalAlpha = seg(tr, SEAL_T + 0.8, 0.6, 'power2.out'); ctx.font = SERIF(700, 58); ctx.textAlign = 'center'; ctx.fillStyle = PLUM;
        ctx.fillText('Your symptom diary', 540, ys + 100); ctx.globalAlpha = 1;
      }
    }
    // grain + light
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'multiply';
    const vg = ctx.createRadialGradient(540, 900, 600, 540, 960, 1300); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(214,196,168,0.25)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  // line 1 "Some days", line 2 "it's rage." / "it's tears." : the last word swaps on its own
  function drawBlockFlow(b, t) {
    if (b.same) return;
    if (b === BLOCKS[0]) {
      drawBlock({ lines: ['Some days'], align: 'right', x: 940, y: 400, px: 150, t0: 1.4, t1: 7.9 }, t);
      const px = 150; tctx.font = SERIF(900, px);
      const wR = tctx.measureText(' rage.').width, wT = tctx.measureText(' tears.').width;
      const swap = seg(t, 5.0, 0.6, 'power2.inOut'), wNow = lerp(wR, wT, swap);
      drawBlock({ lines: ["it's"], align: 'right', x: 940 - wNow, y: 400 + px * 1.04, px, t0: 2.2, t1: 7.9 }, t);
      drawBlock({ lines: ['rage.'], align: 'right', x: 940, y: 400 + px * 1.04, px, t0: 2.6, t1: 5.0 }, t);
      drawBlock({ lines: ['tears.'], align: 'right', x: 940, y: 400 + px * 1.04, px, t0: 5.35, t1: 7.9 }, t);
      return;
    }
    drawBlock(b, t);
  }

  const p = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(p, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => draw(p.t) }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  draw(0);
  if (document.fonts) document.fonts.ready.then(() => { BLOCKS.forEach(b => b.fit = 0); draw(p.t); });
})();
</script>
